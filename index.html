<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch Board</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#17191c;
  --panel:#212429;
  --panel-alt:#2a2e34;
  --border:#383d44;
  --text:#ecedee;
  --text-dim:#9ba1a8;
  --text-faint:#686e76;
  --amber:#f5a623;

  --st-pending:#8b92a0;
  --st-assigned:#5b8def;
  --st-loading:#f5a623;
  --st-transit:#3fbf9f;
  --st-delayed:#e5484d;
  --st-delivered:#4caf6d;
  --st-cancelled:#5a5f66;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
#app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

.topbar{
  display:flex;justify-content:space-between;align-items:flex-end;
  border-bottom:2px solid var(--border);padding-bottom:16px;margin-bottom:22px;flex-wrap:wrap;gap:14px;
}
.topbar h1{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin:0;}
.topbar h1 span{color:var(--amber);}
.topbar p{margin:4px 0 0;color:var(--text-dim);font-size:13px;font-family:'IBM Plex Mono',monospace;}
.badge-readonly{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);
  border:1px solid var(--border);border-radius:20px;padding:5px 12px;white-space:nowrap;
}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:14px 16px;}
.stat .n{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;}
.stat .l{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px;margin-top:2px;}
.stat.accent-transit .n{color:var(--st-transit);}
.stat.accent-delayed .n{color:var(--st-delayed);}
.stat.accent-delivered .n{color:var(--st-delivered);}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:20px;}
.panel h3{font-family:'Oswald',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin:0 0 10px;}
.link-row{display:flex;gap:8px;flex-wrap:wrap;}
.link-chip{background:var(--panel-alt);border:1px solid var(--border);border-radius:20px;padding:8px 16px;font-size:13px;}
.link-chip a{color:var(--text);text-decoration:none;}
.link-chip a:hover{color:var(--amber);text-decoration:underline;}
.empty-note{color:var(--text-faint);font-size:12.5px;font-style:italic;}

.driver-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
.driver-card{background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;padding:11px 12px;}
.driver-card .dname{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;}
.driver-card .dmeta{font-size:12px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;margin-top:3px;}
.driver-card .dstatus{display:inline-block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;padding:2px 8px;border-radius:10px;margin-top:7px;}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:6px;position:relative;overflow:hidden;padding:16px 16px 14px 20px;display:flex;flex-direction:column;gap:10px;}
.beacon{position:absolute;left:0;top:0;bottom:0;width:5px;}
.beacon.pulse{animation:pulse 1.8s ease-in-out infinite;}
.beacon.pulse-fast{animation:pulse 0.9s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 4px 0 currentColor inset;opacity:1;}50%{box-shadow:0 0 14px 2px currentColor inset;opacity:.55;}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.loadid{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text-dim);letter-spacing:.5px;}
.stamp{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;padding:3px 9px;border:2px dashed;border-radius:3px;transform:rotate(-6deg);white-space:nowrap;}
.route{display:flex;align-items:center;gap:8px;font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;}
.route .arrow{color:var(--text-faint);font-size:14px;}
.miles{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);margin-top:-4px;}
.driverline{display:flex;justify-content:space-between;font-size:13px;color:var(--text-dim);border-top:1px solid var(--border);padding-top:9px;}
.driverline b{color:var(--text);font-weight:500;}
.metarow{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
.metarow span:last-child{color:var(--text);}
.notes{font-size:12.5px;color:var(--text-dim);font-style:italic;line-height:1.4;}

.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-dim);border:1px dashed var(--border);border-radius:8px;}
.empty b{color:var(--text);display:block;font-family:'Oswald',sans-serif;font-size:18px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div>
      <h1>Dispatch <span>Board</span></h1>
      <p id="updated-line">Loading...</p>
    </div>
    <span class="badge-readonly">VIEW ONLY</span>
  </div>

  <div class="stats" id="stats"></div>

  <div class="panel">
    <h3>Billing &amp; Resources</h3>
    <div class="link-row" id="link-row"></div>
  </div>

  <div class="panel">
    <h3>Driver Roster</h3>
    <div class="driver-grid" id="driver-grid"></div>
  </div>

  <div class="board" id="board"></div>
</div>

<script>
const STATUS_META = {
  pending:   { label:'Pending',    color:'var(--st-pending)'   },
  assigned:  { label:'Assigned',   color:'var(--st-assigned)'  },
  loading:   { label:'Loading',    color:'var(--st-loading)'   },
  transit:   { label:'In Transit', color:'var(--st-transit)'   },
  delayed:   { label:'Delayed',    color:'var(--st-delayed)'   },
  delivered: { label:'Delivered',  color:'var(--st-delivered)' },
  cancelled: { label:'Cancelled',  color:'var(--st-cancelled)' },
};
const DRIVER_STATUS_META = {
  available:   { label:'Available',   color:'var(--st-delivered)' },
  onload:      { label:'On Load',     color:'var(--st-assigned)'  },
  offduty:     { label:'Off Duty',    color:'var(--st-pending)'   },
  maintenance: { label:'Maintenance', color:'var(--st-delayed)'   },
};
const STATUS_ORDER = ['delayed','transit','loading','assigned','pending','delivered','cancelled'];

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalizeUrl(u){ return /^https?:\/\//i.test(u) ? u : 'https://' + u; }
function fmtDate(v){
  if(!v) return '—';
  const d = new Date(v);
  if(isNaN(d)) return '—';
  return d.toLocaleString(undefined,{month:'short',day:'numeric', hour:'numeric', minute:'2-digit'});
}

function render(data){
  const items = data.items || [];
  const drivers = data.drivers || [];
  const links = data.links || [];

  document.getElementById('updated-line').textContent = data.updatedAt
    ? 'Last updated ' + new Date(data.updatedAt).toLocaleString()
    : 'No data published yet';

  // stats
  const active = items.filter(i=>!['delivered','cancelled'].includes(i.status));
  const transit = items.filter(i=>i.status==='transit');
  const delayed = items.filter(i=>i.status==='delayed');
  const today = new Date().toDateString();
  const deliveredToday = items.filter(i=>i.status==='delivered' && i.delivery && new Date(i.delivery).toDateString()===today);
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${active.length}</div><div class="l">Active Loads</div></div>
    <div class="stat accent-transit"><div class="n">${transit.length}</div><div class="l">In Transit</div></div>
    <div class="stat accent-delayed"><div class="n">${delayed.length}</div><div class="l">Delayed</div></div>
    <div class="stat accent-delivered"><div class="n">${deliveredToday.length}</div><div class="l">Delivered Today</div></div>
  `;

  // links
  const linkRow = document.getElementById('link-row');
  linkRow.innerHTML = links.length===0
    ? `<span class="empty-note">No links published yet.</span>`
    : links.map(l=>`<div class="link-chip"><a href="${escapeHtml(normalizeUrl(l.url))}" target="_blank" rel="noopener noreferrer">${escapeHtml(l.name)}</a></div>`).join('');

  // drivers
  const driverGrid = document.getElementById('driver-grid');
  driverGrid.innerHTML = drivers.length===0
    ? `<span class="empty-note">No drivers published yet.</span>`
    : drivers.map(d=>{
        const meta = DRIVER_STATUS_META[d.status] || DRIVER_STATUS_META.available;
        const unit = [d.truck ? 'Unit '+d.truck : '', d.trailer ? 'Trailer '+d.trailer : ''].filter(Boolean).join(' · ');
        return `<div class="driver-card">
          <div class="dname">${escapeHtml(d.name||'Unnamed')}</div>
          <div class="dmeta">${escapeHtml(d.phone||'')}</div>
          ${unit ? `<div class="dmeta">${escapeHtml(unit)}</div>` : ''}
          <div class="dstatus" style="color:${meta.color};background:${meta.color}22;">${meta.label}</div>
        </div>`;
      }).join('');

  // board
  const board = document.getElementById('board');
  if(items.length===0){
    board.innerHTML = `<div class="empty"><b>Nothing published yet</b>Check back after the dispatcher's next update.</div>`;
    return;
  }
  const sorted = [...items].sort((a,b)=>{
    const pa = STATUS_ORDER.indexOf(a.status), pb = STATUS_ORDER.indexOf(b.status);
    if(pa!==pb) return pa-pb;
    const da = a.pickup ? new Date(a.pickup).getTime() : Infinity;
    const db = b.pickup ? new Date(b.pickup).getTime() : Infinity;
    return da-db;
  });
  board.innerHTML = sorted.map(i=>{
    const meta = STATUS_META[i.status] || STATUS_META.pending;
    const pulseClass = i.status==='delayed' ? 'pulse-fast' : (i.status==='transit' ? 'pulse' : '');
    return `<div class="card">
      <div class="beacon ${pulseClass}" style="background:${meta.color};color:${meta.color};"></div>
      <div class="card-top">
        <span class="loadid">${escapeHtml(i.loadCode||'')}</span>
        <span class="stamp" style="color:${meta.color};border-color:${meta.color};">${meta.label}</span>
      </div>
      <div>
        <div class="route">${escapeHtml(i.origin||'—')} <span class="arrow">&#10230;</span> ${escapeHtml(i.destination||'—')}</div>
        <div class="miles">${i.miles ? i.miles+' mi' : ''}${i.rate ? (i.miles?' &middot; ':'') + '$'+Number(i.rate).toLocaleString() : ''}</div>
      </div>
      <div class="metarow"><span>Pickup</span><span>${fmtDate(i.pickup)}</span></div>
      <div class="metarow"><span>Delivery</span><span>${fmtDate(i.delivery)}</span></div>
      <div class="driverline">
        <span><b>${escapeHtml(i.driver||'Unassigned')}</b>${i.truck ? ' · Unit '+escapeHtml(i.truck) : ''}</span>
        <span>${escapeHtml(i.phone||'')}</span>
      </div>
      ${i.customer ? `<div class="metarow"><span>Customer</span><span>${escapeHtml(i.customer)}</span></div>` : ''}
      ${i.notes ? `<div class="notes">"${escapeHtml(i.notes)}"</div>` : ''}
    </div>`;
  }).join('');
}

fetch('./data.json', {cache:'no-store'})
  .then(r=>{ if(!r.ok) throw new Error('no data.json yet'); return r.json(); })
  .then(render)
  .catch(()=>{
    document.getElementById('updated-line').textContent = 'No data published yet';
    document.getElementById('board').innerHTML = `<div class="empty"><b>Nothing published yet</b>The dispatcher hasn't published a data.json file to this site yet.</div>`;
    document.getElementById('link-row').innerHTML = `<span class="empty-note">No links published yet.</span>`;
    document.getElementById('driver-grid').innerHTML = `<span class="empty-note">No drivers published yet.</span>`;
    document.getElementById('stats').innerHTML = '';
  });
</script>
</body>
</html>
